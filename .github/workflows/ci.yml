name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install "genvm-linter==0.11.0" "genlayer-test==0.29.2" "pytest>=8,<9" pycryptodome
      - name: Kill-set and rubric gate
        run: python3 HONESTKEEPER_KILLSET_CHECK.py contracts/HonestKeeper.py
      - name: genvm-linter lint (AST, offline; not "check", which needs the network)
        run: python3 -m genvm_linter.cli lint contracts/HonestKeeper.py
      - uses: actions/cache@v4
        with:
          path: ~/.cache/gltest-direct
          key: genvm-universal-v0.2.16
      - name: Pin the GenVM SDK used by Direct Mode to the contract's v0.2.16 header
        run: |
          mkdir -p ~/.cache/gltest-direct
          f=~/.cache/gltest-direct/genvm-universal-v0.2.16.tar.xz
          [ -f "$f" ] || curl -fsSL -o "$f" https://github.com/genlayerlabs/genvm/releases/download/v0.2.16/genvm-universal.tar.xz
      - name: Contract tests (Direct Mode, real SDK, mocked model)
        run: python3 -m pytest tests/contract -q -p no:cacheprovider

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run verify:source
      - name: Calldata size table (offline)
        run: node tools/calldata-bytes.mjs

  probe:
    # Runs only once deployments.json carries an address. Uses gen_call simulation
    # on StudioNet: no wallet, no transaction, no model call.
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm ci
      - name: Probe calldata on the RPC
        run: |
          for key in intelligent_contract project; do
            addr=$(node -e "console.log(require('./deployments.json')['$key'] || '')")
            if [ -n "$addr" ]; then echo "== $key $addr"; node tools/probe-calldata.mjs "$addr"; else echo "== $key: no address yet, skipped"; fi
          done
